<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Asociación Gitana Europea e Intercultural de Torrent | Asoginter-ter</title>

    <meta name="description"
          content="Asociación Gitana Europea e Intercultural de Torrent. Voz del pueblo gitano de Torrent.">

    <style>
        /* =========================
           CONFIGURACIÓN GENERAL
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
            background: #ffffff;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
        }

        .contenedor {
            width: 90%;
            max-width: 1150px;
            margin: auto;
        }


        /* =========================
           CABECERA
        ========================== */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.97);
            border-bottom: 1px solid #eeeeee;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.06);
        }

        .barra-navegacion {
            min-height: 82px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .marca {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #222;
        }

        .marca img {
            width: 58px;
            height: 58px;
            object-fit: contain;
        }

        .marca-texto {
            display: flex;
            flex-direction: column;
        }

        .marca-nombre {
            font-size: 18px;
            font-weight: 800;
            color: #222;
        }

        .marca-subtitulo {
            font-size: 12px;
            color: #dc2626; /* Rojo de la rueda */
            font-weight: 700;
            margin-top: 2px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav a {
            color: #333;
            font-size: 14px;
            font-weight: 700;
            transition: 0.3s;
        }

        nav a:hover {
            color: #1d4ed8; /* Azul Gitano */
        }

        .boton-nav {
            background: #1d4ed8; /* Azul Gitano */
            color: white !important;
            padding: 11px 18px;
            border-radius: 25px;
        }

        .boton-nav:hover {
            background: #1e40af;
        }


        /* =========================
           PORTADA
        ========================== */

        .hero {
            position: relative;
            overflow: hidden;
            min-height: 680px;
            display: flex;
            align-items: center;
            background:
                radial-gradient(circle at 50% 20%, rgba(29, 78, 216, 0.08), transparent 35%),
                radial-gradient(circle at 50% 80%, rgba(22, 163, 74, 0.10), transparent 35%),
                linear-gradient(135deg, #f0fdf4 0%, #ffffff 55%, #eff6ff 100%);
        }

        .hero-contenido {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 40px;
            width: 100%;
        }

        .etiqueta {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 30px;
            background: #fee2e2; /* Rojo suave */
            color: #dc2626; /* Rojo de la rueda */
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(38px, 5vw, 65px);
            line-height: 1.1;
            color: #222;
            margin-bottom: 24px;
            letter-spacing: -1.5px;
        }

        .hero h1 span {
            color: #1d4ed8; /* Azul Gitano */
        }

        .hero-texto {
            max-width: 750px;
            margin: 0 auto 30px auto;
            font-size: 19px;
            color: #666;
        }

        .botones {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        .boton-principal {
            display: inline-block;
            background: #1d4ed8; /* Azul Gitano */
            color: white;
            padding: 14px 25px;
            border-radius: 30px;
            font-weight: 700;
            transition: 0.3s;
            box-shadow: 0 8px 25px rgba(29, 78, 216, 0.18);
        }

        .boton-principal:hover {
            transform: translateY(-2px);
            background: #1e40af;
        }

        .boton-secundario {
            display: inline-block;
            border: 2px solid #16a34a; /* Verde Gitano */
            color: #15803d;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            transition: 0.3s;
        }

        .boton-secundario:hover {
            background: #16a34a;
            color: white;
        }

        .hero-logo {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-logo::before {
            content: "";
            position: absolute;
            width: 390px;
            height: 390px;
            background: linear-gradient(
                135deg,
                rgba(239, 68, 68, 0.06),
                rgba(29, 78, 216, 0.06),
                rgba(22, 163, 74, 0.06)
            );
            border-radius: 50%;
            z-index: 0;
        }

        .hero-logo img {
            position: relative;
            z-index: 1;
            width: 330px;
            max-width: 90%;
            filter: drop-shadow(0 20px 20px rgba(0, 0, 0, 0.13));
        }


        /* =========================
           SECCIONES
        ========================== */

        section {
            padding: 90px 0;
        }

        .titulo-seccion {
            text-align: center;
            margin-bottom: 55px;
        }

        .titulo-seccion .pequeno {
            color: #1d4ed8; /* Azul Gitano */
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .titulo-seccion h2 {
            font-size: 38px;
            margin: 8px 0 15px;
            color: #222;
        }

        .titulo-seccion p {
            max-width: 700px;
            margin: auto;
            color: #777;
        }


        /* =========================
           QUIÉNES SOMOS
        ========================== */

        .nosotros {
            background: #ffffff;
        }

        .nosotros-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .nosotros-texto h3 {
            font-size: 30px;
            color: #222;
            margin-bottom: 20px;
        }

        .nosotros-texto p {
            color: #666;
            margin-bottom: 16px;
        }

        .frase {
            margin-top: 25px;
            padding: 20px 25px;
            border-left: 5px solid #16a34a; /* Verde Gitano */
            background: #f0fdf4;
            border-radius: 0 12px 12px 0;
            color: #555;
            font-weight: 600;
        }

        .tarjeta-destacada {
            padding: 45px;
            border-radius: 25px;
            background: linear-gradient(135deg, #1d4ed8, #1e40af); /* Gradiente Azul Gitano */
            color: white;
            box-shadow: 0 20px 45px rgba(29, 78, 216, 0.15);
        }

        .tarjeta-destacada h3 {
            font-size: 30px;
            margin-bottom: 18px;
        }

        .tarjeta-destacada p {
            opacity: 0.94;
        }


        /* =========================
           OBJETIVOS
        ========================== */

        .objetivos {
            background: #f8f8fa;
        }

        .tarjetas {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .tarjeta {
            background: white;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            text-align: center;
        }
        
        .tarjeta h4 {
            font-size: 20px;
            color: #222;
            margin: 10px 0;
        }
        
        .tarjeta p {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div class="contenedor barra-navegacion">
            <a href="#" class="marca">
                <img src="LOGO ASOGINTER (1).png" alt="Logo Asoginter-ter">
                <div class="marca-texto">
                    <span class="marca-nombre">ASOGINTER-TER</span>
                    <span class="marca-subtitulo">Asociación Gitana Europea</span>
                </div>
            </a>

            <nav>
                <a href="#inicio">Inicio</a>
                <a href="#quienes-somos">Quiénes somos</a>
                <a href="#objetivos">Objetivos</a>
                <a href="#actividades">Actividades</a>
                <a href="#contacto" class="boton-nav">Contacto</a>
            </nav>
        </div>
    </header>

    <section id="inicio" class="hero">
        <div class="contenedor hero-contenido">
            <div>
                <span class="etiqueta">Torrent · Valencia</span>
                <h1>Asociación Gitana <br><span>Europee e Intercultural</span></h1>
                <p class="hero-texto">Una asociación comprometida con la comunidad gitana, la convivencia, la igualdad y la interculturalidad.</p>
